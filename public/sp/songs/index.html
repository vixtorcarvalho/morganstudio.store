<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Netflix Previewer — Trailer Evaluation Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    
    .widget-card {
      width: 100%;
      height: 100%;
      background: #141414;
      border-radius: 16px;
      padding: 12px 14px;
      border: 1.5px solid rgba(229, 9, 20, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 16px rgba(229, 9, 20, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    /* PROGRESS */
    .progress-head { margin-bottom: 2px; }
    .progress-top {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; color: #b3b3b3; margin-bottom: 5px;
      position: relative;
    }
    .progress-earned { color: #E50914; font-size: 12px; display: inline-block; transition: color .3s; }
    .progress-track { height: 5px; background: #2a2a2a; border-radius: 99px; overflow: hidden; }
    .progress-fill {
      height: 100%; width: 0%; border-radius: 99px; background: #E50914;
      box-shadow: 0 0 10px rgba(229, 9, 20, .6); transition: width .5s ease;
    }

    @keyframes earned-bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); color: #ff4d56; }
      100% { transform: scale(1); }
    }
    .progress-earned.bump { animation: earned-bump .45s ease; }

    .earn-float {
      position: absolute;
      right: 4px;
      top: -6px;
      font-size: 13px;
      font-weight: 800;
      color: #ff4d56;
      text-shadow: 0 0 8px rgba(229, 9, 20, .8);
      animation: float-up 1s ease-out forwards;
      pointer-events: none;
      white-space: nowrap;
    }
    @keyframes float-up {
      from { opacity: 0; transform: translateY(6px); }
      25% { opacity: 1; }
      to { opacity: 0; transform: translateY(-18px); }
    }

    /* INSTRUCTION BANNER */
    .instruction-banner {
      background: rgba(229, 9, 20, 0.12);
      border: 1px solid rgba(229, 9, 20, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #ff4d56;
      text-align: center;
      line-height: 1.35;
    }

    /* 16:9 CINEMATIC VIDEO PLAYER */
    .video-stage {
      position: relative;
      width: 100%;
      height: 176px;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #2a2a2a;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .video-stage.playing {
      border-color: #E50914;
      box-shadow: 0 0 16px rgba(229, 9, 20, 0.45);
    }
    .trailer-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .video-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 3;
    }
    .video-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .netflix-n-tag {
      background: #E50914;
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 3px;
      letter-spacing: 0.4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.7);
      flex-shrink: 0;
    }
    .video-meta-text {
      min-width: 0;
    }
    .song-name {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .song-artist {
      font-size: 10px;
      color: #d4d4d4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .timer-pill {
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(229,9,20,0.6);
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .play-overlay-btn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      background: rgba(229, 9, 20, 0.92);
      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7), 0 0 16px rgba(229,9,20,0.6);
      z-index: 4;
      transition: opacity 0.25s, transform 0.2s;
      cursor: pointer;
    }
    .video-stage.playing .play-overlay-btn {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.85);
    }
    .play-overlay-btn svg {
      width: 22px; height: 22px; fill: #ffffff; margin-left: 2px;
    }
    .video-bottom-progress {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(255,255,255,0.2);
      z-index: 3;
    }
    .video-bottom-fill {
      height: 100%;
      width: 0%;
      background: #E50914;
      transition: width 0.25s linear;
    }

    /* QUESTIONS / STAR RATING */
    .questions-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: opacity 0.3s;
      opacity: 0.35;
      pointer-events: none;
    }
    .questions-wrap.unlocked {
      opacity: 1;
      pointer-events: auto;
    }
    .question-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .question-title {
      font-size: 11.5px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .yn-row {
      display: flex;
      gap: 6px;
    }
    .yn-btn {
      flex: 1;
      background: #242424;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 7px 0;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .yn-btn .star-char { color: #f5c518; font-size: 13px; }
    .yn-btn.selected {
      background: #E50914;
      color: #ffffff;
      border-color: #E50914;
      font-weight: 800;
      box-shadow: 0 2px 10px rgba(229, 9, 20, 0.45);
    }
    .yn-btn.selected .star-char { color: #ffffff; }

    /* FINISH BUTTON */
    .finish-btn {
      width: 100%;
      background: #2a2a2a;
      border: none;
      border-radius: 999px;
      padding: 10px;
      color: #777777;
      font-size: 12.5px;
      font-weight: 800;
      cursor: not-allowed;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      outline: none;
    }
    .finish-btn.active {
      background: #E50914;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.5);
    }
    .finish-btn.active:hover { transform: scale(1.01); background: #f40612; }

    /* SUCCESS CARD */
    .success-card {
      display: none;
      background: rgba(229, 9, 20, 0.12);
      border: 1.5px solid #E50914;
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      flex: 1;
      margin: auto 0;
      animation: fadeIn 0.25s ease-out;
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.15);
    }
    .success-card.show { display: flex !important; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-icon {
      width: 34px; height: 34px;
      background: #E50914;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .success-icon svg { width: 18px; height: 18px; stroke: #fff; }
    .success-title { font-size: 14px; font-weight: 700; color: #ffffff; }
    .received-label { font-size: 11px; color: #b3b3b3; text-transform: uppercase; letter-spacing: 0.5px; }
    .received-val { font-size: 22px; font-weight: 800; color: #E50914; }
  </style>
</head>
<body>

  <div class="widget-card">

    <!-- PROGRESS -->
    <div class="progress-head">
      <div class="progress-top">
        <span id="progressLabel">Trailer 1 of 4</span>
        <span class="progress-earned" id="progressEarned">Earned $0.00</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- INSTRUCTION BANNER -->
    <div class="instruction-banner" id="instructionBanner">
      🎬 Tap <strong>PLAY</strong> on the trailer below and watch 10s to unlock your 1–5★ rating.
    </div>

    <!-- 16:9 VIDEO STAGE -->
    <div class="video-stage" id="videoStage">
      <video class="trailer-video" id="trailerVideo" playsinline webkit-playsinline preload="metadata" poster="/sp/trailers/thumb1.jpg"></video>
      <div class="video-top-bar">
        <div class="video-title-wrap">
          <span class="netflix-n-tag">N</span>
          <div class="video-meta-text">
            <div class="song-name" id="songName">Stranger Things: Final Chapter</div>
            <div class="song-artist" id="songArtist">Netflix Original Series • Official Teaser</div>
          </div>
        </div>
        <div class="timer-pill" id="timerPill">10s</div>
      </div>
      <button class="play-overlay-btn" id="playBtn" type="button" aria-label="Play Trailer">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="video-bottom-progress">
        <div class="video-bottom-fill" id="videoBottomFill"></div>
      </div>
    </div>

    <!-- QUESTIONS (1 TO 5 STARS RATING) -->
    <div class="questions-wrap" id="questionsWrap">
      <div class="question-block">
        <p class="question-title" id="q1Title">Rate this trailer &amp; thumbnail (1 to 5 stars):</p>
        <div class="yn-row" id="starRow">
          <button type="button" class="yn-btn star-opt" data-star="1"><span class="star-char">★</span> 1</button>
          <button type="button" class="yn-btn star-opt" data-star="2"><span class="star-char">★</span> 2</button>
          <button type="button" class="yn-btn star-opt" data-star="3"><span class="star-char">★</span> 3</button>
          <button type="button" class="yn-btn star-opt" data-star="4"><span class="star-char">★</span> 4</button>
          <button type="button" class="yn-btn star-opt" data-star="5"><span class="star-char">★</span> 5</button>
        </div>
      </div>
    </div>

    <!-- FINISH BTN -->
    <button class="finish-btn" id="finishBtn" disabled>SUBMIT RATING &amp; EARN</button>

    <!-- SUCCESS CARD -->
    <div class="success-card" id="successCard">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="success-title">Trailer Rating Logged!</div>
      <div class="received-label">Balance Credited</div>
      <div class="received-val" id="rewardAmount">+$52.40</div>
    </div>

  </div>

  <script>
    var TRAILERS = [
      {
        name: 'Stranger Things: Final Chapter',
        artist: 'Netflix Original Series • Official Teaser',
        poster: '/sp/trailers/thumb1.jpg',
        src: '/sp/trailers/trailer1.mp4',
        reward: 52.40
      },
      {
        name: 'The Witcher: Blood Origin',
        artist: 'Netflix Original Series • Official Preview',
        poster: '/sp/trailers/thumb2.jpg',
        src: '/sp/trailers/trailer2.mp4',
        reward: 56.80
      },
      {
        name: 'Outside the Wire',
        artist: 'Netflix Original Film • Sci-Fi Action Trailer',
        poster: '/sp/trailers/thumb3.jpg',
        src: '/sp/trailers/trailer3.mp4',
        reward: 54.20
      },
      {
        name: 'The Last Kingdom: Seven Kings Must Die',
        artist: 'Netflix Original Film • Official Trailer',
        poster: '/sp/trailers/thumb4.jpg',
        src: '/sp/trailers/trailer4.mp4',
        reward: 51.40
      }
    ];

    var REQUIRED_SECONDS = 12;
    var earnedTotal = 0;

    var host = window.location.hostname.toLowerCase();
    var isDevelopment = host === 'localhost'
      || host === '127.0.0.1'
      || host.indexOf('id-preview--') === 0
      || host.endsWith('-dev.lovable.app')
      || host.endsWith('.lovableproject.com')
      || host.endsWith('.sandbox.lovable.dev')
      || (function () {
        var urls = [window.location.search, document.referrer];
        try { urls.push(window.parent.location.search); } catch (e) {}
        try { urls.push(window.top.location.search); } catch (e) {}
        return urls.some(function (u) { return /[?&]dev=1(&|$)/.test(u || ''); });
      })();

    var songIndex = 0;
    var totalDone = 0;
    var isPlaying = false;
    var songUnlocked = false;
    var simInterval = null;
    var simSeconds = REQUIRED_SECONDS;
    var q1Answer = null;

    var rewardSound = new Audio('/sp/songs/reward.mp3');
    rewardSound.volume = 1.0;
    rewardSound.load();

    function playRewardSound() {
      try {
        rewardSound.currentTime = 0;
        rewardSound.play().catch(function(){});
      } catch(e){}
    }

    var instructionBanner = document.getElementById('instructionBanner');
    var videoStage = document.getElementById('videoStage');
    var trailerVideo = document.getElementById('trailerVideo');
    var songName = document.getElementById('songName');
    var songArtist = document.getElementById('songArtist');
    var timerPill = document.getElementById('timerPill');
    var videoBottomFill = document.getElementById('videoBottomFill');
    var playBtn = document.getElementById('playBtn');
    var questionsWrap = document.getElementById('questionsWrap');
    var q1Title = document.getElementById('q1Title');
    var starBtns = document.querySelectorAll('.star-opt');
    var finishBtn = document.getElementById('finishBtn');
    var successCard = document.getElementById('successCard');
    var rewardAmount = document.getElementById('rewardAmount');
    var progressLabel = document.getElementById('progressLabel');
    var progressEarned = document.getElementById('progressEarned');
    var progressFill = document.getElementById('progressFill');

    function updateProgress() {
      var current = Math.min(totalDone + 1, TRAILERS.length);
      progressLabel.textContent = totalDone >= TRAILERS.length
        ? 'All trailers rated'
        : 'Trailer ' + current + ' of ' + TRAILERS.length;
      progressEarned.textContent = 'Earned $' + earnedTotal.toFixed(2);
      progressFill.style.width = ((totalDone / TRAILERS.length) * 100) + '%';
    }

    function celebrateReward(rewardVal) {
      try { if (navigator.vibrate) navigator.vibrate(80); } catch(e){}
      var f = document.createElement('span');
      f.className = 'earn-float';
      f.textContent = '+$' + rewardVal.toFixed(2);
      progressEarned.parentElement.appendChild(f);
      setTimeout(function(){ try { f.remove(); } catch(e){} }, 1100);
      progressEarned.classList.remove('bump');
      void progressEarned.offsetWidth;
      progressEarned.classList.add('bump');
    }

    function sendBalanceToParent(rewardVal) {
      var msg = { type: 'sp-add-balance', reward: rewardVal };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, '*');
      } else if (window.top && window.top !== window) {
        window.top.postMessage(msg, '*');
      }
    }

    function notifyCompletionToTypebot() {
      var eventName = 'finalizar_musicas';
      var msg = { type: eventName, name: eventName, event: eventName, finalBalance: 214.80 };
      try { window.parent.postMessage(msg, '*'); } catch(e){}
      try { window.top.postMessage(msg, '*'); } catch(e){}
      try { window.parent.postMessage(eventName, '*'); } catch(e){}
      try { window.top.postMessage(eventName, '*'); } catch(e){}
      var fallbackMsg = { type: 'sp-completed-evaluations', name: 'sp-completed-evaluations' };
      try { window.parent.postMessage(fallbackMsg, '*'); } catch(e){}
      try { window.top.postMessage(fallbackMsg, '*'); } catch(e){}
    }

    function setPlayingState(playing) {
      isPlaying = playing;
      if (playing) {
        videoStage.classList.add('playing');
      } else {
        videoStage.classList.remove('playing');
      }
    }

    function unlockQuestions() {
      songUnlocked = true;
      timerPill.textContent = 'Unlocked ✓';
      videoBottomFill.style.width = '100%';
      questionsWrap.classList.add('unlocked');
      instructionBanner.innerHTML = '⭐ Preview complete! Select a <strong>1 to 5★ rating</strong> below and tap <strong>SUBMIT RATING & EARN</strong>';
      checkReady();
    }

    function startCountdown() {
      if (simInterval) return;
      simInterval = setInterval(function() {
        if (!isPlaying) return;
        simSeconds--;
        var pct = Math.min(100, ((REQUIRED_SECONDS - simSeconds) / REQUIRED_SECONDS) * 100);
        videoBottomFill.style.width = pct + '%';
        if (simSeconds <= 0) {
          clearInterval(simInterval);
          simInterval = null;
          unlockQuestions();
        } else {
          timerPill.textContent = simSeconds + 's';
          if (!songUnlocked) {
            instructionBanner.innerHTML = '🎬 Watching trailer preview (' + simSeconds + 's remaining) to unlock 1–5★ rating...';
          }
        }
      }, 1000);
    }

    function loadTrailer() {
      var item = TRAILERS[songIndex % TRAILERS.length];
      songName.textContent = item.name;
      songArtist.textContent = item.artist;
      q1Title.textContent = 'Rate "' + item.name + '" & its thumbnail (1 to 5 stars):';

      try { trailerVideo.pause(); } catch(e){}
      trailerVideo.poster = item.poster;
      trailerVideo.src = item.src;
      trailerVideo.load();

      setPlayingState(false);
      songUnlocked = false;
      simSeconds = REQUIRED_SECONDS;
      timerPill.textContent = REQUIRED_SECONDS + 's';
      videoBottomFill.style.width = '0%';
      if (simInterval) { clearInterval(simInterval); simInterval = null; }

      q1Answer = null;
      starBtns.forEach(function(b) { b.classList.remove('selected'); });
      
      finishBtn.disabled = true;
      finishBtn.classList.remove('active');
      finishBtn.style.display = 'block';

      questionsWrap.classList.remove('unlocked');
      questionsWrap.style.display = 'flex';
      videoStage.style.display = 'block';
      instructionBanner.style.display = 'block';
      instructionBanner.innerHTML = '🎬 Tap <strong>PLAY</strong> on the trailer below and watch ' + REQUIRED_SECONDS + 's to unlock your 1–5★ rating.';
      successCard.classList.remove('show');
      updateProgress();
      if (isDevelopment) {
        unlockQuestions();
      }
    }

    function checkReady() {
      if (q1Answer !== null && songUnlocked) {
        finishBtn.disabled = false;
        finishBtn.classList.add('active');
      } else {
        finishBtn.disabled = true;
        finishBtn.classList.remove('active');
      }
    }

    starBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        starBtns.forEach(function(b) { b.classList.remove('selected'); });
        this.classList.add('selected');
        q1Answer = this.getAttribute('data-star');
        checkReady();
      });
    });

    trailerVideo.addEventListener('ended', function() {
      setPlayingState(false);
      if (simInterval) { clearInterval(simInterval); simInterval = null; }
      if (!songUnlocked) unlockQuestions();
    });

    function togglePlay() {
      if (isPlaying) {
        try { trailerVideo.pause(); } catch(e){}
        setPlayingState(false);
      } else {
        trailerVideo.muted = false;
        trailerVideo.play().then(function() {
          setPlayingState(true);
          startCountdown();
        }).catch(function() {
          trailerVideo.muted = true;
          trailerVideo.play().then(function() {
            setPlayingState(true);
            startCountdown();
          }).catch(function() {
            setPlayingState(true);
            startCountdown();
          });
        });
      }
    }

    videoStage.addEventListener('click', togglePlay);

    finishBtn.addEventListener('click', function() {
      if (finishBtn.disabled) return;
      var item = TRAILERS[songIndex % TRAILERS.length];

      playRewardSound();
      sendBalanceToParent(item.reward);

      try { trailerVideo.pause(); } catch(e){}
      setPlayingState(false);
      if (simInterval) { clearInterval(simInterval); simInterval = null; }

      totalDone += 1;
      songIndex += 1;
      earnedTotal += item.reward;
      updateProgress();
      celebrateReward(item.reward);

      instructionBanner.style.display = 'none';
      videoStage.style.display = 'none';
      questionsWrap.style.display = 'none';
      finishBtn.style.display = 'none';

      rewardAmount.textContent = '+$' + item.reward.toFixed(2);
      successCard.classList.add('show');

      setTimeout(function() {
        if (totalDone < TRAILERS.length) {
          loadTrailer();
          if (!isDevelopment) togglePlay();
        } else {
          notifyCompletionToTypebot();
          successCard.style.display = 'none';
          instructionBanner.style.display = 'flex';
          instructionBanner.style.flexDirection = 'column';
          instructionBanner.style.alignItems = 'center';
          instructionBanner.style.justifyContent = 'center';
          instructionBanner.style.height = '100%';
          instructionBanner.style.margin = 'auto 0';
          instructionBanner.style.fontSize = '13px';
          instructionBanner.style.padding = '16px';
          instructionBanner.innerHTML = '🎉 <strong style="font-size:15px; margin-bottom:4px;">Daily Limit Reached!</strong>Continue in the chat below to withdraw your <strong>$214.80</strong>.';
        }
      }, 900);
    });

    loadTrailer();
  </script>
</body>
</html>
